<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 — Hermes 知识库</title>
    <style>
      /* 包豪斯风格降级页：白底 + 3px 粗边框 + 领域色实色几何，内联以保离线可用 */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fafaf7;
        color: #1a1a1a;
        font-family: "Space Grotesk", "JetBrains Mono", system-ui, -apple-system, sans-serif;
      }
      .card {
        background: #ffffff;
        border: 3px solid #1a1a1a;
        border-radius: 2px;
        padding: 2.5rem 2rem;
        max-width: 24rem;
        width: calc(100% - 2rem);
        text-align: center;
        position: relative;
      }
      .geo {
        position: absolute;
        top: -10px;
        left: -10px;
        width: 28px;
        height: 28px;
        background: #6b2c2c;
      }
      .eyebrow {
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.7rem;
        color: #6b2c2c;
        margin: 0 0 0.75rem;
        font-weight: 700;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; font-weight: 700; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.6; color: #4a4a4a; }
      .btn {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1.4rem;
        background: #6b2c2c;
        color: #ffffff;
        text-decoration: none;
        border: 3px solid #1a1a1a;
        border-radius: 2px;
        font-weight: 700;
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="geo" aria-hidden="true"></span>
      <p class="eyebrow">OFFLINE</p>
      <h1>离线模式</h1>
      <p>当前处于离线状态，仅可查看已缓存内容。请检查网络连接后重试。</p>
      <a class="btn" href="/">重新连接</a>
    </main>
  </body>
</html>
