[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes"
version = "0.6.0"
description = "Hermes - AI 原生知识库平台 + Independent agent layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hermes Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language Python :: 3",
    "Programming Language Python :: 3.10",
    "Programming Language Python :: 3.11",
    "Programming Language Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # M0+M1 知识库依赖
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pypdf>=4.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # sqlite-vec ANN 索引（E3）
    # "pysqlite3-binary>=0.5.4",  # Windows/Python3.12 不兼容
    # "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]
embedding = [
    # 可选：本地 sentence-transformers 后端
    "sentence-transformers>=2.7",
]
obsidian = [
    # 可选：Obsidian vault 实时同步
    "watchdog>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
hermes = "hermes.main:main"
hermes-kb = "hermes.kb_cli:main"
hermes-kb-migrate = "hermes.kb_cli:migrate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入在函数签名默认值中调用是框架惯用法，B008 属误报
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.security.HTTPBearer",
    "fastapi.security.HTTPAuthorizationCredentials",
]

[tool.ruff.lint.per-file-ignores]
# 技能脚本（独立 CLI 工具）：以下规则属命令行工具惯用法，统一在配置层豁免，
# 避免在工具代码中散落大量 noqa —— 宽异常兜底 / 静默吞错 / 直接抛异常 /
# 本地 naive 时间 / subprocess 手动处理错误。核心库与测试仍保持严格门禁。
"skills/**/scripts/*.py" = [
    "BLE001",   # CLI 工具宽异常捕获兜底
    "S110",     # try-except-pass 可选依赖/网络兜底
    "S112",     # try-except-continue 跳过单条失败
    "TRY002",   # 脚本内直接 raise Exception 作为退出信号
    "DTZ005",   # 行情/金融脚本使用本地 naive 时间
    "DTZ006",
    "DTZ007",
    "PLW1510",  # subprocess 手动 check 结果并处理失败
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
