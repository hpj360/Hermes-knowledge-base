name: Sync API Data Sources

on:
  schedule:
    # 每日 00:00 UTC（北京时间 08:00）自动同步
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-data-sources
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Fetch API data sources
        run: uv run python scripts/sync_api_to_snapshots.py

      - name: Commit and push snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sources/*_sync.json
          if git diff --staged --quiet; then
            echo "无新数据需要提交"
          else
            git commit -m "chore(data): 自动同步 API 数据源快照 (daily)"
            git push
          fi
