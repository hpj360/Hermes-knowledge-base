name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 后端：ruff + pytest（含覆盖率门槛）
  # -------------------------------------------------------------------------
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt -r requirements-dev.txt
          pip install -e -q .

      - name: Ruff check
        run: ruff check .

      - name: Pytest with coverage
        run: |
          pytest --cov=hermes_kb --cov-report=term-missing --cov-report=xml --cov-fail-under=90
        env:
          KB_ENV: test
          KB_JWT_SECRET: ci-test-secret-do-not-use-in-prod
          KB_AUTH_ENABLED: "false"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------------
  # 前端：tsc + vitest + build
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (tsc + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc -b

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  # -------------------------------------------------------------------------
  # 综合校验：verify-state.sh（git 同步 + 测试 + ruff + 关键文件）
  # -------------------------------------------------------------------------
  verify-state:
    name: Verify State
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q -r requirements.txt -r requirements-dev.txt
          pip install -e -q .

      - name: Run verify-state.sh
        run: bash scripts/verify-state.sh
        env:
          KB_ENV: test
          KB_JWT_SECRET: ci-test-secret-do-not-use-in-prod
