# Alembic config -- Hermes KB
#
# Notes:
# - sqlalchemy.url is a placeholder only; at runtime migrations/env.py overrides
#   it from hermes_kb.config.get_settings().db_url (single config source, no hardcoding).
# - script_location points to the in-package migrations directory (effective when
#   running `alembic` from the project root).
# - prepend_sys_path = src ensures `import hermes_kb.*` works in env.py (usable from
#   project root via `alembic upgrade head` even without install).

[alembic]
script_location = src/hermes_kb/migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC
# Version file naming: 0001_initial_schema.py (readable + ordered)
file_template = %%(rev)s_%%(slug)s

# Placeholder -- env.py overrides at runtime
sqlalchemy.url = sqlite:///placeholder.db

[post_write_hooks]
# To enable formatting, wire up ruff/black here; left empty for now

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
